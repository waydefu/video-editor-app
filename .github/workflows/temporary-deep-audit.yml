name: Temporary deep audit formatting
on:
  push:
    branches:
      - fix/v088-project-isolation-20261121
    paths:
      - .github/workflows/temporary-deep-audit.yml

permissions:
  contents: write

jobs:
  format-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Report dependency vulnerabilities
        shell: bash
        run: |
          node - <<'NODE'
          const { spawnSync } = require("node:child_process");
          const result = spawnSync("npm", ["audit", "--json"], { encoding: "utf8", maxBuffer: 12 * 1024 * 1024 });
          const data = JSON.parse(result.stdout || "{}");
          console.log("NPM_AUDIT_SUMMARY", JSON.stringify(data.metadata?.vulnerabilities ?? {}));
          for (const [name, issue] of Object.entries(data.vulnerabilities ?? {})) {
            console.log("NPM_AUDIT_ISSUE", JSON.stringify({
              name, severity: issue.severity, direct: issue.isDirect, via: issue.via,
              fixAvailable: issue.fixAvailable, range: issue.range,
            }).slice(0, 1200));
          }
          NODE
      - name: Prettier changed files
        run: |
          npx prettier --write scripts/package-win.mjs src/main/ipc.ts src/main/main.ts src/main/services/http-byte-range.ts src/main/services/preview-protocol.ts src/main/services/project-store.ts src/main/services/render-disk-space.ts src/main/services/standalone-subtitle-store.ts src/main/services/trusted-navigation.ts src/main/services/youtube-upload.ts src/renderer/App.tsx src/shared/domain.ts tests/concat-render.integration.test.ts tests/http-byte-range.test.ts tests/project-store.test.ts tests/render-disk-space.test.ts tests/standalone-subtitle-store.test.ts tests/trusted-navigation.test.ts tests/youtube-upload.test.ts tests/renderer/App.test.tsx
      - name: Commit formatted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/package-win.mjs src tests
          if ! git diff --cached --quiet; then
            git commit -m "style: format deep audit fixes"
            git push origin HEAD:refs/heads/fix/v088-project-isolation-20261121
          fi
