name: Temporary format for project isolation
on:
  push:
    branches:
      - fix/v088-project-isolation-20261121
    paths:
      - .github/workflows/temporary-project-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/main/ipc.ts src/main/services/project-store.ts src/main/services/standalone-subtitle-store.ts tests/project-store.test.ts tests/standalone-subtitle-store.test.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/ipc.ts src/main/services/project-store.ts src/main/services/standalone-subtitle-store.ts tests/project-store.test.ts tests/standalone-subtitle-store.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format project isolation changes"
            git push origin HEAD:refs/heads/fix/v088-project-isolation-20261121
          fi
