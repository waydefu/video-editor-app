name: CI

# Pull requests only need read access to repository contents.
permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      matrix:
        # Pinned job mirrors the local toolchain; latest job guards
        # forward compatibility (e.g. FFmpeg 9 removed -filter_complex_script).
        ffmpeg: ["8.1.2", "latest"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install FFmpeg (retry transient Chocolatey feed errors)
        shell: pwsh
        run: |
          $requested = "${{ matrix.ffmpeg }}"
          $arguments = @("install", "ffmpeg", "-y", "--no-progress")
          if ($requested -ne "latest") { $arguments += "--version=$requested" }
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & choco @arguments
            $binary = Get-Command ffmpeg -ErrorAction SilentlyContinue
            if ($LASTEXITCODE -eq 0 -and $binary) {
              $versionLine = (& ffmpeg -version | Select-Object -First 1)
              if ($requested -eq "latest" -or $versionLine -match ("^ffmpeg version " + [regex]::Escape($requested) + "(?:\D|$)")) {
                $installed = $true
                break
              }
              Write-Warning "Expected FFmpeg $requested but PATH resolves to: $versionLine"
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          if (-not $installed) { throw "FFmpeg $requested cannot be installed after 3 attempts." }

      - name: Show FFmpeg version
        run: |
          where.exe ffmpeg
          ffmpeg -version

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (block high and critical advisories)
        run: npm audit --audit-level=high

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck (main + renderer)
        run: npm run typecheck

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build
