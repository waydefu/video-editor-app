name: Temporary security dependency patch
on:
  push:
    branches:
      - fix/v088-project-isolation-20261121
    paths:
      - .github/workflows/temporary-security-dependencies.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Patch within supported release lines
        shell: bash
        run: |
          npm install --save-dev --save-exact electron@44.9.1 vite@8.2.4 vitest@4.1.12
          npm audit fix || true
      - name: Report remaining vulnerabilities
        shell: bash
        run: |
          node - <<'NODE'
          const { spawnSync } = require("node:child_process");
          const result = spawnSync("npm", ["audit", "--json"], { encoding: "utf8", maxBuffer: 12 * 1024 * 1024 });
          const data = JSON.parse(result.stdout || "{}");
          console.log("POST_PATCH_AUDIT_SUMMARY", JSON.stringify(data.metadata?.vulnerabilities ?? {}));
          for(const [name, issue] of Object.entries(data.vulnerabilities ?? {}))
            console.log("POST_PATCH_AUDIT_ISSUE", JSON.stringify({name,severity:issue.severity,fixAvailable:issue.fixAvailable}));
          NODE
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: patch Electron, Vite, Vitest and transitive dependency advisories"
            git push origin HEAD:refs/heads/fix/v088-project-isolation-20261121
          fi
