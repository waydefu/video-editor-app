name: Temporary round-two formatting
on:
  push:
    branches:
      - fix/v088-project-isolation-20261121
    paths:
      - .github/workflows/temporary-round2-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/SECOND_PASS_AUDIT_2026-11-22.md src/main/services/subtitle-ai-check.ts src/main/services/standalone-subtitle-store.ts src/main/services/remote-control-server.ts src/main/services/project-store.ts src/main/services/youtube-upload.ts src/main/ipc.ts tests/standalone-subtitle-store.test.ts tests/remote-control-server.test.ts tests/project-store.test.ts tests/youtube-upload.test.ts
      - name: Commit formatting only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SECOND_PASS_AUDIT_2026-11-22.md src/main/services/subtitle-ai-check.ts src/main/services/standalone-subtitle-store.ts src/main/services/remote-control-server.ts src/main/services/project-store.ts src/main/services/youtube-upload.ts src/main/ipc.ts tests/standalone-subtitle-store.test.ts tests/remote-control-server.test.ts tests/project-store.test.ts tests/youtube-upload.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format round-two reliability fixes"
            git push origin HEAD:refs/heads/fix/v088-project-isolation-20261121
          fi
