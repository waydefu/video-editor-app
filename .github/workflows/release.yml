name: Release

# Full `npm run package:win` requires an externally provided, checksum-pinned
# licensed shutter sound asset (assets/camera-shutter-click-14671.mp3 or
# SCENERYWALKER_SHUTTER_MP3). The asset is not committed to this repository.
# By default only dist + dist-electron ship. A signed portable package is opt-in
# and requires the approved asset and a pinned Ed25519 release key.
#
# Trigger: push a tag like v0.56.0, or run manually from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (block high and critical advisories)
        run: npm audit --audit-level=high

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck (main + renderer)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install FFmpeg (retry transient Chocolatey feed errors)
        shell: pwsh
        run: |
          $requested = "8.1.2"
          $arguments = @("install", "ffmpeg", "-y", "--no-progress")
          if ($requested -ne "latest") { $arguments += "--version=$requested" }
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & choco @arguments
            $binary = Get-Command ffmpeg -ErrorAction SilentlyContinue
            if ($LASTEXITCODE -eq 0 -and $binary) {
              $versionLine = (& ffmpeg -version | Select-Object -First 1)
              if ($requested -eq "latest" -or $versionLine -match ("^ffmpeg version " + [regex]::Escape($requested) + "(?:\D|$)")) {
                $installed = $true
                break
              }
              Write-Warning "Expected FFmpeg $requested but PATH resolves to: $versionLine"
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds (20 * $attempt) }
          }
          if (-not $installed) { throw "FFmpeg $requested cannot be installed after 3 attempts." }

      - name: Show FFmpeg version
        run: |
          where.exe ffmpeg
          ffmpeg -version

      - name: Tests
        run: npx vitest run

      - name: Build and smoke-test signed portable update package (opt-in)
        if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_SIGNED_PORTABLE_RELEASE == 'true'
        shell: pwsh
        env:
          SHUTTER_BASE64: ${{ secrets.SCENERYWALKER_SHUTTER_MP3_BASE64 }}
          UPDATE_PUBLIC_KEY: ${{ vars.SCENERYWALKER_UPDATE_PUBLIC_KEY_PEM }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Release tag/version mismatch" }
          if (-not $env:SHUTTER_BASE64 -or -not $env:UPDATE_PUBLIC_KEY) { throw "Missing release asset or public key" }
          $env:SCENERYWALKER_SHUTTER_MP3 = Join-Path $env:RUNNER_TEMP "scenerywalker-shutter.mp3"
          $env:SCENERYWALKER_UPDATE_PUBLIC_KEY = Join-Path $env:RUNNER_TEMP "scenerywalker-update-public.pem"
          [IO.File]::WriteAllBytes($env:SCENERYWALKER_SHUTTER_MP3, [Convert]::FromBase64String($env:SHUTTER_BASE64))
          [IO.File]::WriteAllText($env:SCENERYWALKER_UPDATE_PUBLIC_KEY, $env:UPDATE_PUBLIC_KEY)
          Remove-Item Env:SHUTTER_BASE64
          npm run package:win
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }
          npm run smoke:packaged
          if ($LASTEXITCODE -ne 0) { throw "Packaged smoke failed" }
          tar.exe -a -c -f scenerywalker-portable-win-x64.zip -C "release/v$version" SceneryWalkerSourceOrganizer-win32-x64
          if ($LASTEXITCODE -ne 0) { throw "Archive failed" }

      - name: Sign verified portable package
        if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_SIGNED_PORTABLE_RELEASE == 'true'
        shell: pwsh
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SCENERYWALKER_UPDATE_PRIVATE_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:SIGNING_KEY_BASE64) { throw "Missing update signing key" }
          $key = Join-Path $env:RUNNER_TEMP "scenerywalker-update-private.pem"
          try {
            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:SIGNING_KEY_BASE64))
            Remove-Item Env:SIGNING_KEY_BASE64
            $publicKey = Join-Path $env:RUNNER_TEMP "scenerywalker-update-public.pem"
            node scripts/sign-portable-update.mjs scenerywalker-portable-win-x64.zip scenerywalker-portable-update.json $key $publicKey $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { throw "Manifest signing failed" }
          } finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
          }

      - name: Pack dist output
        run: Compress-Archive -Path dist,dist-electron -DestinationPath scenerywalker-dist.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            scenerywalker-dist.zip
            scenerywalker-portable-*.zip
            scenerywalker-portable-update.json
          generate_release_notes: true
