name: Release

# Full `npm run package:win` requires an externally provided, checksum-pinned
# licensed shutter sound asset (assets/camera-shutter-click-14671.mp3 or
# SCENERYWALKER_SHUTTER_MP3). The asset is not committed to this repository.
# This workflow therefore ships only verified dist + dist-electron, NOT a
# packaged Windows executable, as a versioned GitHub Release.
#
# Trigger: push a tag like v0.56.0, or run manually from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install FFmpeg 8.1.2 (pinned to local toolchain; 9.x drops filter_complex_script)
        run: choco install ffmpeg --version=8.1.2 -y

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (block high and critical advisories)
        run: npm audit --audit-level=high

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck (main + renderer)
        run: npm run typecheck

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Pack dist output
        run: Compress-Archive -Path dist,dist-electron -DestinationPath scenerywalker-dist.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: scenerywalker-dist.zip
          generate_release_notes: true
