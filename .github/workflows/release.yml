name: Release

# Full `npm run package:win` requires an externally provided, checksum-pinned
# licensed shutter sound asset (assets/camera-shutter-click-14671.mp3 or
# SCENERYWALKER_SHUTTER_MP3). The asset is not committed to this repository.
# This workflow therefore ships only verified dist + dist-electron, NOT a
# packaged Windows executable, as a versioned GitHub Release.
#
# Trigger: push a tag like v0.56.0, or run manually from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (block high and critical advisories)
        run: npm audit --audit-level=high

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck (main + renderer)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install FFmpeg (retry transient Chocolatey feed errors)
        shell: pwsh
        run: |
          $requested = "8.1.2"
          $arguments = @("install", "ffmpeg", "-y", "--no-progress")
          if ($requested -ne "latest") { $arguments += "--version=$requested" }
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & choco @arguments
            $binary = Get-Command ffmpeg -ErrorAction SilentlyContinue
            if ($LASTEXITCODE -eq 0 -and $binary) {
              $versionLine = (& ffmpeg -version | Select-Object -First 1)
              if ($requested -eq "latest" -or $versionLine -match ("^ffmpeg version " + [regex]::Escape($requested) + "(?:\D|$)")) {
                $installed = $true
                break
              }
              Write-Warning "Expected FFmpeg $requested but PATH resolves to: $versionLine"
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds (20 * $attempt) }
          }
          if (-not $installed) { throw "FFmpeg $requested cannot be installed after 3 attempts." }

      - name: Show FFmpeg version
        run: |
          where.exe ffmpeg
          ffmpeg -version

      - name: Tests
        run: npx vitest run

      - name: Pack dist output
        run: Compress-Archive -Path dist,dist-electron -DestinationPath scenerywalker-dist.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: scenerywalker-dist.zip
          generate_release_notes: true
