name: Temporary render research documentation formatter
on:
  push:
    branches:
      - fix/v088-project-isolation-20261121
    paths:
      - .github/workflows/temporary-long-render-doc-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/LONG_RENDER_PERFORMANCE_2026-11-23.md
      - name: Commit documentation formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LONG_RENDER_PERFORMANCE_2026-11-23.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format long-render research report"
            git push origin HEAD:refs/heads/fix/v088-project-isolation-20261121
          fi
